name: AI upscale test (Real-ESRGAN sample)

# Временный тест — реальный AI-апскейл (Real-ESRGAN, бесплатно, без ключей/оплаты)
# на нескольких образцах, чтобы оценить результат до запуска на всех 2978 фото.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  upscale-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan (software rendering, no GPU on CI runners)
        run: sudo apt-get update -y && sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - name: Download Real-ESRGAN ncnn-vulkan binary
        run: |
          curl -L -o realesrgan.zip https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          mkdir realesrgan
          unzip -q realesrgan.zip -d realesrgan
          chmod +x realesrgan/realesrgan-ncnn-vulkan

      - name: Upscale sample images (x4) and downscale to a sane final size
        run: |
          if ! command -v convert &> /dev/null; then
            sudo apt-get install -y imagemagick
          fi
          mkdir -p images-ai-test-preview
          for f in items1.jpg items2652.jpg items100.jpg items500.jpg; do
            ./realesrgan/realesrgan-ncnn-vulkan -i "images/$f" -o "/tmp/up_$f" -n realesrgan-x4plus
            convert "/tmp/up_$f" -resize 1000x1000 -quality 90 "images-ai-test-preview/$f"
          done

      - name: Commit sample previews
        run: |
          git config user.name "photo-enhance-bot"
          git config user.email "actions@users.noreply.github.com"
          git add images-ai-test-preview/
          git commit -m "Test preview: Real-ESRGAN upscaled sample images"
          git push
