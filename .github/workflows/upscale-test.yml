name: Upscale test (Real-ESRGAN, sample only)

# Временный воркфлоу — проверка, работает ли бесплатный локальный ИИ-апскейлер
# на CI-машине без GPU (через программный Vulkan), и сколько это занимает времени.
# Удалить после проверки.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  upscale-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install software Vulkan support
        run: sudo apt-get update -y && sudo apt-get install -y mesa-vulkan-drivers libvulkan1

      - name: Download Real-ESRGAN ncnn-vulkan
        run: |
          curl -L -o realesrgan.zip https://github.com/xinntao/Real-ESRGAN-ncnn-vulkan/releases/download/v0.2.0/realesrgan-ncnn-vulkan-20220424-ubuntu.zip
          unzip -q realesrgan.zip -d realesrgan
          chmod +x realesrgan/realesrgan-ncnn-vulkan

      - name: Upscale sample images and measure time
        run: |
          mkdir -p images-upscale-preview
          for f in items1.jpg items2652.jpg items100.jpg; do
            echo "=== $f ==="
            time ./realesrgan/realesrgan-ncnn-vulkan -i "images/$f" -o "images-upscale-preview/$f" -n realesrgan-x4plus -s 4
          done

      - name: Commit sample previews
        run: |
          git config user.name "upscale-test-bot"
          git config user.email "actions@users.noreply.github.com"
          git add images-upscale-preview/
          git commit -m "Test preview: Real-ESRGAN upscaled sample images"
          git push
