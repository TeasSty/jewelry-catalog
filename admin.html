<!-- Старый адрес панели — оставлен для тех, у кого сохранена ссылка на admin.html.
     Сама панель теперь живёт в /admin/ (папка admin, файл index.html), чтобы можно
     было заходить просто по адресу /admin, без расширения .html -->
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<script>if(window.top!==window.self){window.top.location=window.self.location;}</script>
<meta http-equiv="refresh" content="0; url=admin/">
<link rel="canonical" href="admin/">
<title>Переход в панель администратора…</title>
</head>
<body>
<p>Переход в панель администратора — <a href="admin/">нажмите, если не открылось само</a>.</p>
</body>
</html>
