<!-- admin.html — Версия с безопасным обновлением и списком последних товаров -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Панель управления каталогом</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23c9a24b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 3h12l3 5-9 13L3 8Z'/%3E%3Cpath d='M3 8h18'/%3E%3Cpath d='m9 3 3 5-3 13'/%3E%3Cpath d='m15 3-3 5 3 13'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Та же палитра, что и на сайте (index.html) — админка должна выглядеть частью того же продукта */
      --bg: #1a1a1a;
      --surface: #232323;
      --surface-2: #2a2a2a;
      --border: #3a3a3a;
      --text: #e0e0e0;
      --text-dim: #9a9a9a;
      --accent: #c9a24b;
      --accent-dim: #8f7736;
      --green: #34c759;
      --red: #ef5350;
      --radius: 12px;
      --shadow: 0 8px 24px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); margin: 0; padding: 28px 20px 60px;
    }
    .container { max-width: 900px; margin: 0 auto; }

    .page-title { display: flex; align-items: center; gap: 10px; font-size: 21px; font-weight: 800; margin: 4px 0 22px; color: #fff; }
    .page-title svg { flex: none; color: var(--accent); }

    .card {
      background: var(--surface); padding: 24px; border-radius: var(--radius);
      box-shadow: var(--shadow); border: 1px solid var(--border); margin-bottom: 18px;
    }
    h2 { margin: 0 0 18px; font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 9px; color: #fff; }
    h2 svg { flex: none; color: var(--accent); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 550; font-size: 13.5px; color: var(--text-dim); }
    input, select {
      width: 100%; padding: 11px 12px; border: 1px solid var(--border); border-radius: 8px;
      box-sizing: border-box; font-size: 15px; background: var(--surface-2); color: var(--text);
      transition: border-color .15s;
    }
    input:focus, select:focus { outline: none; border-color: var(--accent-dim); }
    input[type="file"] { padding: 9px 10px; }
    input::placeholder { color: var(--text-dim); }

    button {
      background: var(--accent); color: #1a1a1a; border: none; padding: 12px 20px; border-radius: 8px;
      font-size: 15px; cursor: pointer; font-weight: 700; width: 100%;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s, transform .1s;
    }
    button:hover { background: #dab863; }
    button:active { transform: scale(.99); }
    button:disabled { background: #55503f; color: #9a9a9a; cursor: default; }
    .btn-ghost {
      background: transparent; color: var(--red); border: 1px solid var(--border);
      width: auto; padding: 9px 16px; font-size: 13.5px; font-weight: 600;
    }
    .btn-ghost:hover { background: rgba(239,83,80,.08); border-color: var(--red); }

    .status { padding: 12px 14px; border-radius: 8px; margin-bottom: 16px; display: none; font-size: 13.5px; }
    .status.success { background: rgba(52,199,89,.12); color: #4ede82; border: 1px solid rgba(52,199,89,.35); }
    .status.error { background: rgba(239,83,80,.12); color: #ff8783; border: 1px solid rgba(239,83,80,.35); }

    /* Стили для таблицы товаров/заказов */
    .table-wrapper { overflow-x: auto; margin-top: 4px; border: 1px solid var(--border); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13.5px; }
    th, td { padding: 11px 12px; border-bottom: 1px solid var(--border); }
    th { font-weight: 700; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); background: var(--surface-2); }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: var(--surface-2); }
    .delete-btn, .edit-btn {
      width: auto; padding: 5px 10px; font-size: 12px; border-radius: 6px; font-weight: 700;
    }
    .delete-btn { background: var(--red); color: #fff; }
    .edit-btn { background: var(--green); color: #10321a; margin-right: 4px; }

    select.order-status-select {
      background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    }

    /* ===== Вкладки: Заказы / Редактор товаров ===== */
    .admin-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .admin-tabs { display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px; }
    .admin-tab {
      width: auto; background: none; color: var(--text-dim); font-weight: 600; font-size: 13.5px;
      padding: 9px 16px; border-radius: 7px;
    }
    .admin-tab:hover { background: var(--surface-2); color: var(--text); }
    .admin-tab.active { background: var(--accent); color: #1a1a1a; }

    @media (max-width: 560px) {
      .form-row { grid-template-columns: 1fr; }
      .admin-toolbar { flex-direction: column; align-items: stretch; }
      .admin-tabs { justify-content: center; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="page-title">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    Панель управления каталогом
  </div>

  <!-- Блок авторизации -->
  <div id="authContainer" class="card" style="max-width:380px; margin:40px auto;">
    <h2>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      Вход в панель администратора
    </h2>
    <div id="authStatus" class="status error"></div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="authEmail" placeholder="admin@voronin-jewelry.ru">
    </div>
    <div class="form-group">
      <label>Пароль</label>
      <input type="password" id="authPassword" placeholder="••••••••">
    </div>
    <button id="loginBtn">Войти</button>
  </div>

  <!-- Основной интерфейс админки -->
  <div id="adminInterface" style="display: none;">
    <div class="admin-toolbar">
      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="orders" type="button">Заказы</button>
        <button class="admin-tab" data-tab="editor" type="button">Редактор товаров</button>
      </div>
      <button id="logoutBtn" class="btn-ghost" type="button">Выйти</button>
    </div>

    <!-- Заказы, оформленные покупателями на сайте (коллекция "orders" в Firestore) — открыто по умолчанию -->
    <div class="admin-panel" data-panel="orders">
      <div class="card">
        <h2>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          Заказы
        </h2>
        <div id="ordersStatus" style="font-size: 13px; color: var(--text-dim); margin-bottom: 10px;"></div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Дата</th>
                <th>Покупатель</th>
                <th>Телефон</th>
                <th>Товары</th>
                <th>Статус</th>
              </tr>
            </thead>
            <tbody id="ordersTable">
              <tr>
                <td colspan="5" style="text-align: center; color: var(--text-dim);">Загрузка заказов...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Редактор товаров: добавление/изменение + список -->
    <div class="admin-panel" data-panel="editor" style="display:none;">
      <div class="card">
        <h2>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7l9 5 9-5-9-5Z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>
          Добавление / Изменение товара
        </h2>

        <div id="statusMessage" class="status"></div>

        <form id="productForm">
          <div class="form-group">
            <label>Артикул (SKU) *</label>
            <input type="text" id="sku" placeholder="Например: КП-141" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Вес изделия (в граммах)</label>
              <input type="text" id="weight" placeholder="Например: 4.25">
            </div>
            <div class="form-group">
              <label>Категория *</label>
              <!-- value = слаг, ровно в таком виде category хранится в Firestore и фильтруется на сайте -->
              <select id="category" required>
                <option value="">Выберите категорию</option>
                <option value="koltsa">Кольца</option>
                <option value="obruch">Обручальные</option>
                <option value="sergi">Серьги</option>
                <option value="garnitury">Гарнитуры</option>
                <option value="podveski">Подвески</option>
                <option value="kolie">Колье</option>
                <option value="braslety">Браслеты</option>
                <option value="piercing">Пирсинг</option>
                <option value="tsepi">Цепи/Браслеты (ручная работа)</option>
                <option value="lozhki">Ложки</option>
                <option value="broshi">Броши</option>
                <option value="pravoslavie">Православные</option>
                <option value="vostok">Восток</option>
                <option value="raznoe">Разное</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label>Подкатегория</label>
            <select id="subcategory">
              <option value="">Без подкатегории</option>
            </select>
          </div>
          <div class="form-group">
            <label>Фото товара</label>
            <div style="display:flex; align-items:center; gap:12px; margin-bottom:8px;">
              <img id="imagePreview" style="width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--border); display:none;">
              <span id="imagePreviewEmpty" style="color:var(--text-dim); font-size:13px;">Фото не выбрано</span>
            </div>
            <input type="file" id="imageFile" accept="image/*">
          </div>
          <button type="submit" id="submitBtn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
            Сохранить в Firestore
          </button>
        </form>
      </div>

      <!-- Единый список товаров: без запроса в поиске — первые 20 по возрастанию артикула,
           с запросом — совпадения, тоже по возрастанию. Одна таблица вместо двух -->
      <div class="card">
        <h2>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          Товары
        </h2>
        <div class="form-group" style="margin-bottom: 10px;">
          <input type="text" id="adminSearchInput" placeholder="Поиск по артикулу..." aria-label="Поиск по артикулу" autocomplete="off" readonly>
        </div>
        <div id="adminSearchStatus" style="font-size: 13px; color: var(--text-dim); margin-bottom: 10px;"></div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>SKU</th>
                <th>Категория</th>
                <th>Вес</th>
                <th>Изображение</th>
                <th>Действие</th>
              </tr>
            </thead>
            <tbody id="productsTable">
              <tr>
                <td colspan="5" style="text-align: center; color: var(--text-dim);">Загрузка списка...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import {
    getFirestore,
    collection,
    doc,
    getDoc,
    setDoc,
    deleteDoc,
    getDocs,
    query,
    orderBy,
    limit,
    updateDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  const firebaseConfig = {
    apiKey: "AIzaSyDKo5f366jIkLQVlrL9GHIHt_6dgHvIhUs",
    authDomain: "voronin-jewelry.firebaseapp.com",
    projectId: "voronin-jewelry",
    messagingSenderId: "1067796651938",
    appId: "1:1067796651938:web:3d89a194660765b4869cfb",
    measurementId: "G-FJ9Z8C6YG"
  };

  // Бесплатный ключ с api.imgbb.com — Firebase Storage требует платный план Blaze,
  // поэтому фото храним на ImgBB (тем же сервисом уже пользуется часть старого каталога).
  const IMGBB_API_KEY = "91c4cbac6c838e8bd3331814fe6b6a68";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const CATEGORY_NAMES = {
    koltsa: "Кольца", obruch: "Обручальные", sergi: "Серьги", garnitury: "Гарнитуры",
    podveski: "Подвески", kolie: "Колье", braslety: "Браслеты", piercing: "Пирсинг",
    tsepi: "Цепи/Браслеты (ручная работа)", lozhki: "Ложки", broshi: "Броши",
    pravoslavie: "Православные", vostok: "Восток", raznoe: "Разное"
  };

  // Должно совпадать с подкатегориями в index.html — иначе фильтры на сайте и выбор в админке расходятся
  const subcatMap = {
    obruch: ["Гладкие", "С алмазной гранью"],
    sergi: ["Шары", "Конго", "Продевки", "Детские"],
    garnitury: ["С алмазной гранью", "Со вставками"],
    podveski: ["Зодиак"],
    pravoslavie: ["Кольца", "Подвески"]
  };

  // ===== Вкладки: Заказы (по умолчанию) / Редактор товаров =====
  document.querySelectorAll(".admin-tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".admin-tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      document.querySelectorAll(".admin-panel").forEach(p => {
        p.style.display = p.dataset.panel === tab.dataset.tab ? "block" : "none";
      });
    });
  });

  // Текущее фото товара при редактировании — как оно РЕАЛЬНО хранится в базе (может быть
  // просто "items3139.jpg" без "images/" — так писали старые товары с исходного сайта).
  // Пустая строка — фото не выбрано/не установлено.
  let currentImageValue = "";

  // То же самое, что resolveImagePath в index.html: для показа превью бере путь "как есть" для
  // ссылок/blob-объектов, а голое имя файла достраивает как "images/имя.jpg"
  function resolveImagePathForPreview(raw) {
    const path = String(raw || "").trim();
    if (!path) return "";
    if (/^(https?:)?\/\//i.test(path) || path.startsWith("data:") || path.startsWith("blob:")) return path;
    const clean = path.replace(/^\/+/, "");
    return clean.startsWith("images/") ? clean : "images/" + clean;
  }

  function setImagePreview(rawValue) {
    const img = document.getElementById("imagePreview");
    const empty = document.getElementById("imagePreviewEmpty");
    const url = resolveImagePathForPreview(rawValue);
    if (url) {
      img.src = url;
      img.style.display = "block";
      empty.style.display = "none";
    } else {
      img.style.display = "none";
      empty.style.display = "block";
    }
  }

  // Показываем превью сразу после выбора файла, не дожидаясь загрузки на сервер
  document.getElementById("imageFile").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) setImagePreview(URL.createObjectURL(file));
  });

  // Переключение подкатегорий
  document.getElementById("category").addEventListener("change", (e) => {
    const cat = e.target.value;
    const subSelect = document.getElementById("subcategory");
    subSelect.innerHTML = '<option value="">Без подкатегории</option>';

    if(subcatMap[cat]) {
      subcatMap[cat].forEach(sub => {
        subSelect.innerHTML += `<option value="${sub}">${sub}</option>`;
      });
    }
  });

  // Отслеживание сессии авторизации
  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById("authContainer").style.display = "none";
      document.getElementById("adminInterface").style.display = "block";
      allProductsCache = null; // на случай повторного входа в этой же вкладке
      refreshProductsList();
      loadOrders();
    } else {
      document.getElementById("authContainer").style.display = "block";
      document.getElementById("adminInterface").style.display = "none";
    }
  });

  // Вход / Выход
  document.getElementById("loginBtn").addEventListener("click", async () => {
    const email = document.getElementById("authEmail").value.trim();
    const pass = document.getElementById("authPassword").value.trim();
    const authStatus = document.getElementById("authStatus");

    try {
      authStatus.style.display = "none";
      await signInWithEmailAndPassword(auth, email, pass);
    } catch(err) {
      authStatus.innerText = "Ошибка авторизации: " + err.message;
      authStatus.style.display = "block";
    }
  });

  document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));

  // Обработка отправки формы
  document.getElementById("productForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMessage");

    const sku = document.getElementById("sku").value.trim();
    const weight = document.getElementById("weight").value.trim();
    const category = document.getElementById("category").value;
    const subcategory = document.getElementById("subcategory").value;
    const file = document.getElementById("imageFile").files[0];

    statusMsg.style.display = "none";

    // 1. Проверка пустого SKU на клиенте
    if (!sku) {
      statusMsg.className = "status error";
      statusMsg.innerText = "Ошибка: Артикул (SKU) не может быть пустым!";
      statusMsg.style.display = "block";
      return;
    }

    try {
      submitBtn.disabled = true;

      // Если выбран новый файл — загружаем его на ImgBB и берём итоговую ссылку.
      // Если нет — оставляем то фото, что уже было у товара (при редактировании).
      let imageValue = currentImageValue;
      if (file) {
        submitBtn.innerText = "Загружаю фото...";
        const formData = new FormData();
        formData.append("image", file);
        const uploadRes = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
          method: "POST",
          body: formData
        });
        const uploadData = await uploadRes.json();
        if (!uploadRes.ok || !uploadData.success) {
          throw new Error("Не удалось загрузить фото на ImgBB: " + (uploadData.error?.message || uploadRes.status));
        }
        imageValue = uploadData.data.url;
        submitBtn.innerText = "Сохраняю...";
      }

      const docRef = doc(db, "products", sku);
      const docSnap = await getDoc(docRef);

      // Схема должна совпадать с тем, что читает index.html: поле image, вес числом, category слагом
      const updateData = {
        sku: sku,
        name: sku,
        weight: weight === "" ? "" : (parseFloat(weight.replace(",", ".")) || 0),
        category: category,
        subcategory: subcategory || null,
        image: imageValue,
        updatedAt: serverTimestamp() // Фиксируем дату изменения всегда
      };

      if (!docSnap.exists()) {
        // Если товар новый, прокидываем время создания
        updateData.createdAt = serverTimestamp();
      }

      // Безопасное сохранение без перезаписи createdAt для старых товаров
      await setDoc(docRef, updateData, { merge: true });

      statusMsg.className = "status success";
      statusMsg.innerText = `Товар ${sku} успешно сохранен/обновлен!`;
      statusMsg.style.display = "block";
      allProductsCache = null; // кэш устарел после записи
      refreshProductsList();

      // Очищаем форму для следующей записи
      document.getElementById("sku").value = "";
      document.getElementById("weight").value = "";
      document.getElementById("imageFile").value = "";
      currentImageValue = "";
      setImagePreview("");

    } catch (error) {
      console.error(error);
      statusMsg.className = "status error";
      statusMsg.innerText = "Ошибка: " + error.message;
      statusMsg.style.display = "block";
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerText = "Сохранить в Firestore";
    }
  });

  // Общий рендер строки таблицы товаров — используется и "последними 10", и результатами поиска
  function productRowHtml(item) {
    const image = item.image || item.img || "";
    return `
      <tr id="row-${escapeHtml(item.sku)}"
          data-sku="${escapeHtml(item.sku)}"
          data-weight="${escapeHtml(item.weight ?? "")}"
          data-category="${escapeHtml(item.category || "")}"
          data-subcategory="${escapeHtml(item.subcategory || "")}"
          data-img="${escapeHtml(image)}">
        <td><strong>${escapeHtml(item.sku)}</strong></td>
        <td>${escapeHtml(CATEGORY_NAMES[item.category] || item.category || "")} <span style="font-size:11px;color:var(--text-dim);">${item.subcategory ? ' / ' + escapeHtml(item.subcategory) : ''}</span></td>
        <td>${item.weight ? escapeHtml(item.weight) + ' гр.' : '—'}</td>
        <td><span style="font-size: 11px; color: var(--text-dim);">${escapeHtml(image) || "—"}</span></td>
        <td>
          <button class="edit-btn" style="width:auto;">Редактировать</button>
          <button class="delete-btn" style="width:auto;" data-sku="${escapeHtml(item.sku)}">Удалить</button>
        </td>
      </tr>
    `;
  }

  // Общие обработчики кнопок Редактировать/Удалить для любой таблицы, отрисованной через productRowHtml
  function attachRowHandlers(tbody, onDeleted) {
    tbody.querySelectorAll(".edit-btn").forEach(btn => {
      btn.addEventListener("click", (e) => {
        const row = e.target.closest("tr");

        const sku = row.dataset.sku;
        const weight = row.dataset.weight;
        const category = row.dataset.category;
        const subcategory = row.dataset.subcategory;
        const img = row.dataset.img;

        document.getElementById("sku").value = sku;
        document.getElementById("weight").value = weight;
        document.getElementById("category").value = category;

        const event = new Event('change');
        document.getElementById("category").dispatchEvent(event);

        document.getElementById("subcategory").value = subcategory;

        // Показываем текущее фото товара; выбирать новое нужно только если хотим его заменить
        currentImageValue = img || "";
        document.getElementById("imageFile").value = "";
        setImagePreview(currentImageValue);

        // Редактирование товара живёт во вкладке "Редактор товаров" — переключаемся туда
        document.querySelector('.admin-tab[data-tab="editor"]').click();
        document.getElementById("productForm").scrollIntoView({ behavior: "smooth", block: "center" });
        document.getElementById("weight").focus();
      });
    });

    tbody.querySelectorAll(".delete-btn").forEach(btn => {
      btn.addEventListener("click", async (e) => {
        const skuToDelete = e.target.dataset.sku;
        if (confirm(`Вы уверены, что хотите безвозвратно удалить товар ${skuToDelete}?`)) {
          try {
            await deleteDoc(doc(db, "products", skuToDelete));
            if (onDeleted) onDeleted(skuToDelete);
          } catch (err) {
            alert("Ошибка при удалении: " + err.message);
          }
        }
      });
    });
  }

  // Экранирование HTML перед вставкой через innerHTML. Поля заказа (имя, телефон,
  // комментарий, артикулы в items) заполняет покупатель на сайте — без экранирования
  // это была бы hранимая XSS: скрипт из комментария заказа выполнился бы в браузере
  // папы прямо здесь, в админке, с его правами на запись в Firestore.
  function escapeHtml(value){
    return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
  }

  // Приводит артикул к виду для нечёткого поиска: без регистра, без дефисов/пробелов/точек,
  // без ведущих нулей в числах — чтобы "93", "093", "кл93" и "КЛ-93" находили один и тот же товар.
  function normalizeForSearch(str){
    return String(str || "")
      .toLowerCase()
      .replace(/[\s\-_./\\]+/g, "")
      .replace(/\d+/g, (digits) => digits.replace(/^0+(?=\d)/, ""));
  }

  // Единый список товаров. Firestore не умеет искать "содержит подстроку", поэтому один раз
  // за сессию загружаем весь каталог в память и дальше и список, и поиск работают из него —
  // оба всегда по возрастанию артикула. Кэш инвалидируется после записи/удаления/очистки дублей,
  // чтобы следующий показ не был устаревшим.
  let allProductsCache = null;
  let currentSearchTerm = "";

  async function loadAllProducts(force) {
    if (allProductsCache && !force) return allProductsCache;
    const snapshot = await getDocs(collection(db, "products"));
    allProductsCache = snapshot.docs.map(d => d.data());
    allProductsCache.forEach(item => { item.skuNorm = normalizeForSearch(item.sku); });
    allProductsCache.sort((a, b) => (a.sku || "").localeCompare(b.sku || "", "ru", { numeric: true }));
    return allProductsCache;
  }

  const LIST_DISPLAY_LIMIT = 20;

  async function refreshProductsList() {
    const tbody = document.getElementById("productsTable");
    const statusEl = document.getElementById("adminSearchStatus");
    const term = currentSearchTerm;

    statusEl.innerText = allProductsCache ? "" : "Загрузка каталога...";
    const all = await loadAllProducts(false);

    const matches = term ? all.filter(item => item.skuNorm.includes(term)) : all;
    const shown = matches.slice(0, LIST_DISPLAY_LIMIT);

    if (matches.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--text-dim);">Ничего не найдено</td></tr>`;
    } else {
      tbody.innerHTML = shown.map(productRowHtml).join("");
      attachRowHandlers(tbody, (deletedSku) => {
        allProductsCache = allProductsCache.filter(it => it.sku !== deletedSku);
        refreshProductsList();
      });
    }

    statusEl.innerText = matches.length > LIST_DISPLAY_LIMIT
      ? `Показано ${LIST_DISPLAY_LIMIT} из ${matches.length}${term ? " — уточните запрос" : ""}`
      : `Показано: ${matches.length}`;
  }

  // readonly до фокуса/клика — Chrome не подставляет сохранённые email/пароли
  // в readonly-поля, а обычному вводу это не мешает (см. index.html)
  const adminSearchInputEl = document.getElementById("adminSearchInput");
  const enableAdminSearchInput = () => adminSearchInputEl.removeAttribute("readonly");
  adminSearchInputEl.addEventListener("focus", enableAdminSearchInput);
  adminSearchInputEl.addEventListener("mousedown", enableAdminSearchInput);
  adminSearchInputEl.addEventListener("touchstart", enableAdminSearchInput);

  adminSearchInputEl.addEventListener("input", (e) => {
    currentSearchTerm = normalizeForSearch(e.target.value);
    refreshProductsList();
  });

  // ===== ЗАКАЗЫ =====
  // Покупатели оформляют заказ на сайте (index.html), он попадает сюда — в коллекцию "orders".
  const ORDER_STATUS_LABELS = { new: "Новый", processing: "В обработке", done: "Выполнен" };

  function orderRowHtml(id, order) {
    const date = order.createdAt && typeof order.createdAt.toDate === "function"
      ? order.createdAt.toDate().toLocaleString("ru")
      : "—";
    const itemsText = (order.items || []).map(i => `${escapeHtml(i.sku)} ×${escapeHtml(i.qty)}`).join(", ");
    const status = order.status || "new";

    return `
      <tr>
        <td style="white-space:nowrap;">${date}</td>
        <td>${escapeHtml(order.name || order.email) || "—"}</td>
        <td>${escapeHtml(order.phone) || "—"}</td>
        <td style="max-width:240px;">
          ${itemsText || "—"}
          ${order.comment ? `<br><span style="font-size:11px;color:var(--text-dim);">${escapeHtml(order.comment)}</span>` : ""}
        </td>
        <td>
          <select class="order-status-select" data-id="${id}" style="padding:6px 8px;font-size:12px;border-radius:7px;">
            ${Object.entries(ORDER_STATUS_LABELS).map(([value, label]) =>
              `<option value="${value}" ${status === value ? "selected" : ""}>${label}</option>`
            ).join("")}
          </select>
        </td>
      </tr>
    `;
  }

  function attachOrderHandlers(tbody) {
    tbody.querySelectorAll(".order-status-select").forEach(sel => {
      sel.addEventListener("change", async () => {
        sel.disabled = true;
        try {
          await updateDoc(doc(db, "orders", sel.dataset.id), { status: sel.value });
        } catch (err) {
          alert("Не удалось обновить статус: " + err.message);
        } finally {
          sel.disabled = false;
        }
      });
    });
  }

  async function loadOrders() {
    const tbody = document.getElementById("ordersTable");
    const statusEl = document.getElementById("ordersStatus");
    statusEl.textContent = "Загрузка заказов...";

    try {
      const q = query(collection(db, "orders"), orderBy("createdAt", "desc"), limit(50));
      const snap = await getDocs(q);

      if (snap.empty) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--text-dim);">Заказов пока нет</td></tr>`;
        statusEl.textContent = "";
        return;
      }

      tbody.innerHTML = snap.docs.map(d => orderRowHtml(d.id, d.data())).join("");
      attachOrderHandlers(tbody);
      statusEl.textContent = `Показано: ${snap.docs.length}`;
    } catch (err) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;color:var(--red);">Ошибка загрузки: ${err.message}</td></tr>`;
      statusEl.textContent = "";
    }
  }
</script>
</body>
</html>
